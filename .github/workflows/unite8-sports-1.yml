name: unite8-sports-1

on:
  workflow_dispatch:

jobs:
  unite8-sports-1:
    runs-on: ubuntu-latest
    environment: Cricket
    permissions:
      actions: write
      contents: read

    env:
      PORTAL_URL: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_PORTAL_URL }}
      API_ACCESS_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_API_ACCESS_TOKEN }}
      API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_API_TOKEN }}
      PORTAL_API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_PORTAL_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_CLOUDFLARE_API_TOKEN }}
      TUNNEL_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_TUNNEL_TOKEN }}
    steps:
      - name: Update system packages
        run: sudo apt update
        
      - name: Install system dependencies
        run: |
          sudo apt install -y \
            dos2unix \
            git \
            torsocks \
            inotify-tools \
            curl \
            wget \
            jq \
            software-properties-common \
            apt-transport-https \
            ca-certificates \
            gnupg \
            lsb-release \
            ffmpeg \
            xvfb
        
      - name: Add NodeJS 24.x repository
        run: curl -fsSL https://deb.nodesource.com/setup_24.x | sudo bash
        
      - name: Install NodeJS
        run: sudo apt install -y nodejs
        
      - name: Verify Node.js and npm installation
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
        
      - name: Download Cloudflare Tunnel
        run: curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

      - name: Install Cloudflare Tunnel
        run: sudo dpkg -i cloudflared.deb && rm -f cloudflared.deb
        
      - name: Install Flussonic
        run: |
          curl -sSf http://apt.flussonic.com/binary/gpg.key | sudo tee /etc/apt/trusted.gpg.d/flussonic.gpg > /dev/null
          sudo rm -f /etc/apt/sources.list.d/erlyvideo.list
          echo "deb http://apt.flussonic.com binary/" | sudo tee /etc/apt/sources.list.d/flussonic.list
          sudo apt update
          sudo apt-get -y --install-recommends install flussonic
        
      - name: Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "type": "module",
            "name": "trial-automation",
            "version": "1.0.0",
            "dependencies": {
              "@playwright/test": "^1.60.0",
              "@tensorflow-models/coco-ssd": "^2.2.3",
              "@tensorflow/tfjs": "^4.22.0",
              "adm-zip": "^0.5.17",
              "axios": "^1.16.1",
              "cheerio": "^1.2.0",
              "chokidar": "^5.0.0",
              "jimp": "^1.6.1",
              "playwright": "^1.60.0",
              "playwright-core": "^1.60.0",
              "puppeteer": "^25.1.0",
              "recaptcha-solver": "^0.3.0",
              "sharp": "^0.34.5",
              "wrangler": "^4.96.0"
            }
          }
          EOF
        
      - name: Install Node.js packages
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-audit --no-fund
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Download remote bash file
        run: |
          curl --fail --location --connect-timeout 10 --max-time 60 "${PORTAL_URL%/}/bash-scripts/unite8-sports-1.sh" -o unite8-sports-1.sh || { rm -f unite8-sports-1.sh; echo "Primary URL download failed"; }
        
      - name: Check if bash file exists and download from backup if not
        run: |
          if [ ! -s unite8-sports-1.sh ]; then
            echo "Primary URL file not found, downloading from backup URL"
            wget "${{ secrets.CRICKET_BACKUP_BASH_URL }}/unite8-sports-1.sh"
          else
            echo "Bash file downloaded successfully"
          fi

      - name: Fix line endings in bash file
        run: sudo dos2unix unite8-sports-1.sh || true
        
      - name: Set bash file permissions
        run: |
          sudo chmod +x unite8-sports-1.sh
          sudo chmod 777 unite8-sports-1.sh
        
      - name: Download Node.js automation script
        run: |
          curl --fail --location --connect-timeout 10 --max-time 60 "${PORTAL_URL%/}/bash-scripts/unite8-sports-1-automation.js" -o trial-automation.js || { rm -f trial-automation.js; echo "Node.js script download failed"; }
        
      - name: Check if Node.js script exists and download from backup if not
        run: |
          if [ ! -s trial-automation.js ]; then
            echo "Primary URL file not found, downloading from backup URL"
            wget "${{ secrets.CRICKET_BACKUP_NODE_URL }}/unite8-sports-1-automation.js" -O trial-automation.js
          else
            echo "Node.js script downloaded successfully"
          fi

      - name: Validate downloaded trial automation
        run: |
          if [ ! -s trial-automation.js ] || grep -Fq 'Regenerate and deploy automation from this dashboard after restoring a backup.' trial-automation.js; then
            echo "::error::Trial automation is missing or is a restored placeholder. Regenerate Script and Regenerate Workflow from the production channel dashboard."
            exit 1
          fi
          node --check trial-automation.js
          test -n "$API_ACCESS_TOKEN" || { echo "::error::Missing protected API_ACCESS_TOKEN. Regenerate Workflow from the production dashboard."; exit 1; }
      
      - name: Check dashboard API before connecting WARP
        run: |
          test -n "$API_ACCESS_TOKEN" || { echo "::error::Missing API_ACCESS_TOKEN."; exit 1; }
          umask 077
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "X-API-KEY: $API_ACCESS_TOKEN" -H 'Accept: application/json' \
            "${PORTAL_URL%/}/api/trial-urls/15/check-expired?include_provider_config=false" -o "$response_file"
          node --input-type=module -e 'import fs from "node:fs"; const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (data.success !== true || typeof data.has_expired_trials !== "boolean") throw new Error("Invalid dashboard API response before WARP"); console.log("Dashboard API reachable before WARP; expired trials: " + data.expired_count);' "$response_file"

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
      
      - name: Configure and start Cloudflare WARP
        run: |
          registered=false
          for attempt in 1 2 3; do
            echo "Cloudflare WARP registration attempt ${attempt}/3"
            if warp-cli --accept-tos registration new; then
              registered=true
              break
            fi

            echo "Cloudflare WARP registration failed; waiting before retry..."
            sleep $((attempt * 60))
          done

          if [ "$registered" != "true" ]; then
            echo "::warning::Cloudflare WARP registration failed or was rate-limited; continuing without WARP."
            warp-cli --accept-tos status || true
            exit 0
          fi

          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 5
          warp-cli --accept-tos status || true
      
      - name: Run trial account automation (without sudo)
        continue-on-error: true
        run: |
          xvfb-run -a node trial-automation.js || { echo "::warning::Trial renewal failed; inspect the automation errors above. Streaming will continue."; exit 1; }
      
      - name: Cleanup Failed and Cancelled Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.API_KEY }}
        run: |
          node <<'EOF'
          const axios = require('axios');

          const GITHUB_TOKEN = process.env.GITHUB_TOKEN;
          const OWNER = process.env.GITHUB_REPOSITORY.split('/')[0];
          const REPO = process.env.GITHUB_REPOSITORY.split('/')[1];

          const headers = {
            Authorization: `Bearer ${GITHUB_TOKEN}`,
            Accept: 'application/vnd.github.v3+json',
          };

          async function cleanupWorkflows() {
            try {
              let page = 1;
              let hasMore = true;

              while (hasMore) {
                const response = await axios.get(
                  `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs`,
                  { headers, params: { per_page: 100, page } }
                );

                const runs = response.data.workflow_runs;

                const runsToDelete = runs.filter(
                  (run) => run.conclusion === 'cancelled' || run.conclusion === 'failure'
                );

                for (const run of runsToDelete) {
                  console.log(`Deleting workflow run: ${run.id} (${run.conclusion})`);
                  await axios.delete(
                    `https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${run.id}`,
                    { headers }
                  );
                }

                hasMore = runs.length === 100;
                page++;
              }

              console.log('Cleanup completed successfully.');
            } catch (error) {
              console.error('Error during cleanup:', error.response?.data || error.message);
              process.exit(1);
            }
          }

          cleanupWorkflows();
          EOF
          
      - name: Run the bash script
        run: sudo --preserve-env=API_ACCESS_TOKEN,API_TOKEN,PORTAL_API_TOKEN,GITHUB_TOKEN,CLOUDFLARE_API_TOKEN,TUNNEL_TOKEN bash unite8-sports-1.sh
        
  trigger_workflow:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    env:
      PORTAL_URL: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_PORTAL_URL }}
      API_ACCESS_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_API_ACCESS_TOKEN }}
      API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_API_TOKEN }}
      PORTAL_API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_PORTAL_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_CLOUDFLARE_API_TOKEN }}
      TUNNEL_TOKEN: ${{ secrets.PORTAL_B1EF8F5FCA47BAD7B9BF_TUNNEL_TOKEN }}
    steps:
      - name: Sleep for 5 hours and 58 minutes
        run: sleep $((5*3600 + 58*60))
        
      - name: Trigger new workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.API_KEY }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/unite8-sports-1.yml/dispatches \
            -d '{"ref":"main"}'
